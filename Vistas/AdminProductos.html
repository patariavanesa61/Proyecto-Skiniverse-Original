<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel General de Productos - Skiniverse</title>
    <link rel="stylesheet" href="../assets/CSS/EstiloAdmin.css">
</head>
<body>

    <header class="navbar">
        <div class="nav-brand" style="cursor: pointer;" onclick="irInicio()"><span>💧</span> Skiniverse</div>
        <ul class="nav-links">
            <li><a href="#" onclick="irInicio()">Inicio</a></li>
            <li><a href="#" onclick="irCatalogo()">Catálogo</a></li>
            <li><a href="#" onclick="irPrivacidad()">Privacidad</a></li>
            <li><a href="#" style="font-weight: bold;">Administrar ▼</a></li>
            <li><button class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button></li>
        </ul>
    </header>

    <main class="main-container">
        <div class="admin-header">
            <h1>Panel General de Productos</h1>
            <div class="admin-actions">
                <button type="button" class="btn-action" onclick="verPedidos()">📦 Pedidos</button>
                <button type="button" class="btn-action" onclick="verUsuarios()">👥 Usuarios</button>
                <button type="button" class="btn-action btn-primary-custom" onclick="location.href='FormularioProducto.html'">+ Agregar Nuevo Producto ▼</button>
            </div>
        </div>

        <div class="filter-tabs">
            <button type="button" class="tab active" onclick="filtrar('todos', this)">📌 Todos</button>
            <button type="button" class="tab" onclick="filtrar('propios', this)">🧴 Productos por  Categoria </button>
        </div>

        <div class="table-container">
            <table class="product-table">
                <thead>
                    <tr>
                        <th>Imagen</th>
                        <th>Nombre</th>
                        <th>Categoría</th>
                        <th>Tipo de Piel</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="tbodyProductos">
                    <!-- Dinámico -->
                </tbody>
            </table>
        </div>
    </main>

    <script>
        let filtroActual = 'todos';

        document.addEventListener("DOMContentLoaded", () => {
            // Inicializar datos por defecto si está vacío el localStorage
            if (!localStorage.getItem('skiniverse_productos')) {
                const productosIniciales = [
                    { id: 1, imagen: 'https://via.placeholder.com/35', nombre: 'Limpiadores de espuma', categoria: 'Limpiadores', tipoPiel: 'Todo tipo de piel', precio: 36.95, stock: 51, tipo: 'propios' },
                    { id: 2, imagen: 'https://via.placeholder.com/35', nombre: 'Sérum de Ácido Hialurónico', categoria: 'Tratamientos', tipoPiel: 'Seca / Mixta', precio: 45.00, stock: 12, tipo: 'externos' }
                ];
                localStorage.setItem('skiniverse_productos', JSON.stringify(productosIniciales));
            }
            renderizarTabla();
        });

        function renderizarTabla() {
            const tbody = document.getElementById('tbodyProductos');
            tbody.innerHTML = '';

            let productos = JSON.parse(localStorage.getItem('skiniverse_productos')) || [];
            const filtrados = productos.filter(p => filtroActual === 'todos' || p.tipo === filtroActual);

            if (filtrados.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center; padding:20px; color:#64748b;">No hay productos en esta categoría.</td></tr>`;
                return;
            }

            filtrados.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${p.imagen}" width="35" style="border-radius:4px; object-fit:cover;" alt="Img"></td>
                        <td><strong>${p.nombre}</strong></td>
                        <td>${p.categoria}</td>
                        <td>${p.tipoPiel}</td>
                        <td>$${Number(p.precio).toFixed(2)}</td>
                        <td><span style="background:#10b981; color:white; padding:3px 8px; border-radius:10px; font-size:12px;">${p.stock} unidades</span></td>
                        <td>
                            <button type="button" onclick="location.href='FormularioProducto.html?id=${p.id}'" style="padding:4px 8px; background:#f1f5f9; border:1px solid #cbd5e1; cursor:pointer; border-radius:4px;">✏️ Editar</button>
                            <button type="button" onclick="location.href='DetalleProducto.html?id=${p.id}'" style="padding:4px 8px; background:#e0f2fe; border:1px solid #bae6fd; cursor:pointer; border-radius:4px;">👁️ Ver</button>
                            <button type="button" onclick="borrar(${p.id})" style="padding:4px 8px; background:#fee2e2; border:1px solid #fecaca; cursor:pointer; border-radius:4px;">🗑️ Borrar</button>
                        </td>
                    </tr>
                `;
            });
        }

        function filtrar(tipo, elemento) {
            filtroActual = tipo;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            elemento.classList.add('active');
            renderizarTabla();
        }

        function borrar(id) {
            if (confirm('¿Deseas eliminar este producto?')) {
                let productos = JSON.parse(localStorage.getItem('skiniverse_productos')) || [];
                productos = productos.filter(x => x.id !== id);
                localStorage.setItem('skiniverse_productos', JSON.stringify(productos));
                renderizarTabla();
            }
        }

        function irInicio() { window.location.href = "PaginaPrincipal.html"; }
        function irCatalogo() { alert("Redirigiendo a Catálogo..."); }
        function irPrivacidad() { alert("Mostrando Políticas de Privacidad."); }
        function verPedidos() { window.location.href = "AdminPedidos.html"; }
        function verUsuarios() { window.location.href = "AdminUsuarios.html"; }
        function cerrarSesion() {
            if (confirm("¿Cerrar sesión?")) {
                window.location.href = "Login.html";
            }
        }
    </script>
</body>
</html>
