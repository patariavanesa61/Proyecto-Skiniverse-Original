<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skiniverse - Registro</title>
    <link rel="stylesheet" href="../assets/CSS/EstiloRegistro.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <a href="PaginaPrincipal.html" style="color: white; text-decoration: none;">💧 Skiniverse</a>
        </div>
        <nav>
            <ul>
                <li><a href="PaginaPrincipal.html">Volver al Inicio</a></li>
            </ul>
        </nav>
    </header>

    <div class="auth-container">
        <h2>Crea tu cuenta</h2>
        <p>Únete a la comunidad de Skiniverse</p>

        <form id="registroForm">
            <div class="form-group">
                <label for="nombre">Nombre Completo</label>
                <input type="text" id="nombre" placeholder="Ej. Maria Pérez" required>
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Mínimo 6 caracteres" minlength="6" required>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar Contraseña</label>
                <input type="password" id="confirmPassword" placeholder="Repite tu contraseña" required>
            </div>

            <div id="errorMessage" class="error-message"></div>

            <button type="submit" class="btn-submit">Registrarme</button>
        </form>

        <div class="auth-footer">
            ¿Ya tienes una cuenta? <a href="Login.html">Inicia Sesión</a>
        </div>
    </div>




    <footer>
        <p>&copy; 2026 Skiniverse. Todos los derechos reservados.</p>
    </footer>

    <script src="../Controlador/Registro.js"></script>
</body>
</html>
