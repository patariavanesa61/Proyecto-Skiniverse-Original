<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo y Tienda - Skiniverse</title>
    <link rel="stylesheet" href="../assets/CSS/EstiloAdmin.css">
    <style>
        .store-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .store-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .store-header h1 {
            color: #0f172a;
            font-size: 2.2rem;
            margin-bottom: 10px;
        }
        .store-header p {
            color: #64748b;
            font-size: 1.1rem;
            font-style: italic;
        }
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 25px;
        }
        .product-card {
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
        .product-img-box {
            height: 200px;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            border-bottom: 1px solid #f1f5f9;
        }
        .product-img-box img {
            max-height: 170px;
            max-width: 100%;
            object-fit: contain;
        }
        .fav-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .product-body {
            padding: 20px;
        }
        .product-category {
            font-size: 0.75rem;
            background: #e2e8f0;
            color: #334155;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: 600;
            display: inline-block;
            margin-bottom: 8px;
        }
        .product-title {
            font-size: 1.1rem;
            color: #1e293b;
            margin-bottom: 8px;
            font-weight: bold;
        }
        .product-skin {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 15px;
        }
        .product-footer {
            padding: 0 20px 20px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .product-price {
            font-size: 1.3rem;
            font-weight: bold;
            color: #0284c7;
        }
        .btn-cart {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-cart:hover { background-color: #059669; }
        .btn-detail {
            background-color: #f1f5f9;
            color: #334155;
            border: 1px solid #cbd5e1;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            text-decoration: none;
        }
        
        /* Modales */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-box {
            background: white;
            width: 500px;
            max-width: 90%;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            max-height: 85vh;
            overflow-y: auto;
        }
        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .checkout-form input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

    <!-- Barra de Navegación de Usuario -->
    <header class="navbar">
        <div class="nav-brand" style="cursor: pointer;" onclick="location.href='CatalogoUsuario.html'"><span>💧</span> Skiniverse</div>
        <ul class="nav-links">
            <li><a href="CatalogoUsuario.html">Catálogo</a></li>
            <li><a href="#" onclick="abrirFavoritos(); return false;">❤️ Favoritos (<span id="favCount">0</span>)</a></li>
            <li><a href="#" class="cart-icon" onclick="abrirCarrito(); return false;">🛒 Carrito (<span id="cartCount">0</span>)</a></li>
            <li><button type="button" class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button></li>
        </ul>
    </header>

    <!-- Contenido Principal -->
    <main class="store-container">
        <div class="store-header">
            <h1>Tu Piel, Tu Propio Universo</h1>
            <p>Explora nuestra selección exclusiva de productos para el cuidado facial y corporal.</p>
        </div>

        <!-- Filtros de Categoría -->
        <div class="filter-tabs" style="justify-content: center; margin-bottom: 30px; display: flex; gap: 15px;">
            <button type="button" class="tab active" onclick="filtrarTienda('todos', this)" style="padding: 8px 16px; cursor:pointer;">📌 Todos</button>
            <button type="button" class="tab" onclick="filtrarTienda('propios', this)" style="padding: 8px 16px; cursor:pointer;">🧴 Productos Propios</button>
            <button type="button" class="tab" onclick="filtrarTienda('externos', this)" style="padding: 8px 16px; cursor:pointer;">🏷️ Marcas Externas</button>
        </div>

        <!-- Grilla de Productos -->
        <div class="products-grid" id="gridProductos">
            <!-- Dinámico -->
        </div>
    </main>

    <!-- Modal del Carrito -->
    <div class="modal-overlay" id="modalCarrito">
        <div class="modal-box">
            <h2>🛒 Tu Carrito de Compras</h2>
            <div id="listaCarrito" style="margin: 20px 0;"></div>
            <div style="font-size: 1.2rem; font-weight: bold; text-align: right; margin-bottom: 20px;">
                Total: $<span id="cartTotal">0.00</span>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" class="btn-detail" onclick="cerrarModal('modalCarrito')">Seguir Comprando</button>
                <button type="button" class="btn-cart" onclick="abrirCheckout()">💳 Proceder al Pago</button>
            </div>
        </div>
    </div>

    <!-- Modal de Pasarela de Pago -->
    <div class="modal-overlay" id="modalCheckout">
        <div class="modal-box">
            <h2>💳 Pasarela de Pago Segura</h2>
            <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 20px;">Ingresa tus datos para procesar el pedido.</p>
            <form class="checkout-form" onsubmit="procesarPago(event)">
                <label>Nombre del Titular</label>
                <input type="text" required placeholder="Ej. Dalgi Quintero">
                
                <label>Número de Tarjeta</label>
                <input type="text" required placeholder="**** **** **** 1234" maxlength="19">
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label>Vencimiento</label>
                        <input type="text" required placeholder="MM/AA">
                    </div>
                    <div>
                        <label>CVV</label>
                        <input type="password" required placeholder="123" maxlength="4">
                    </div>
                </div>

                <label>Dirección de Envío</label>
                <input type="text" required placeholder="Ciudad, Barrio, Calle...">

                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
                    <button type="button" class="btn-detail" onclick="cerrarModal('modalCheckout')">Cancelar</button>
                    <button type="submit" class="btn-cart" style="background-color: #0284c7; border: none;">Pagar Ahora</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Funcional -->
    <script>
        let carrito = [];
        let favoritos = [];
        let filtroTienda = 'todos';

        document.addEventListener("DOMContentLoaded", () => {
            if (!localStorage.getItem('skiniverse_productos')) {
                const productosIniciales = [
                    { id: 1, imagen: 'https://via.placeholder.com/200', nombre: 'Limpiadores de espuma', categoria: 'Limpiadores', tipoPiel: 'Todo tipo de piel', activos: 'Espuma Facial limpiadora Cosmenatural Unisex', precio: 37.00, stock: 51, tipo: 'propios' },
                    { id: 2, imagen: 'https://via.placeholder.com/200', nombre: 'Sérum de Ácido Hialurónico', categoria: 'Tratamientos', tipoPiel: 'Seca / Mixta', activos: 'Ácido hialurónico puro y vitamina C', precio: 45.00, stock: 12, tipo: 'externos' }
                ];
                localStorage.setItem('skiniverse_productos', JSON.stringify(productosIniciales));
            }
            renderizarCatalogo();
        });

        function renderizarCatalogo() {
            const grid = document.getElementById('gridProductos');
            if (!grid) return;
            grid.innerHTML = '';

            let productos = JSON.parse(localStorage.getItem('skiniverse_productos')) || [];
            const filtrados = productos.filter(p => filtroTienda === 'todos' || p.tipo === filtroTienda);

            if (filtrados.length === 0) {
                grid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #64748b; padding: 40px;">No hay productos disponibles en esta categoría.</p>`;
                return;
            }

            filtrados.forEach(p => {
                const esFav = favoritos.includes(p.id);
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-img-box">
                            <button type="button" class="fav-btn" onclick="toggleFavorito(${p.id})">${esFav ? '❤️' : '🤍'}</button>
                            <img src="${p.imagen}" alt="${p.nombre}">
                        </div>
                        <div class="product-body">
                            <span class="product-category">${p.categoria}</span>
                            <h3 class="product-title">${p.nombre}</h3>
                            <p class="product-skin">Para: ${p.tipoPiel}</p>
                        </div>
                        <div class="product-footer">
                            <span class="product-price">$${Number(p.precio).toFixed(2)}</span>
                            <div>
                                <a href="DetalleProducto.html?id=${p.id}" class="btn-detail">Ver</a>
                                <button type="button" class="btn-cart" onclick="agregarCarrito(${p.id})">🛒 Añadir</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function filtrarTienda(tipo, elemento) {
            filtroTienda = tipo;
            document.querySelectorAll('.filter-tabs .tab').forEach(t => t.classList.remove('active'));
            elemento.classList.add('active');
            renderizarCatalogo();
        }

        function toggleFavorito(id) {
            if (favoritos.includes(id)) {
                favoritos = favoritos.filter(favId => favId !== id);
            } else {
                favoritos.push(id);
            }
            document.getElementById('favCount').innerText = favoritos.length;
            renderizarCatalogo();
        }

        function agregarCarrito(id) {
            let productos = JSON.parse(localStorage.getItem('skiniverse_productos')) || [];
            let producto = productos.find(p => p.id == id);
            if (producto) {
                carrito.push(producto);
                document.getElementById('cartCount').innerText = carrito.length;
                alert(`¡"${producto.nombre}" fue añadido al carrito con éxito!`);
            }
        }

        function abrirCarrito() {
            const lista = document.getElementById('listaCarrito');
            lista.innerHTML = '';
            let total = 0;

            if (carrito.length === 0) {
                lista.innerHTML = `<p style="text-align: center; color: #64748b; padding: 15px;">Tu carrito está vacío.</p>`;
            } else {
                carrito.forEach((item) => {
                    total += item.precio;
                    lista.innerHTML += `
                        <div class="cart-item">
                            <span>${item.nombre}</span>
                            <span>$${Number(item.precio).toFixed(2)}</span>
                        </div>
                    `;
                });
            }
            document.getElementById('cartTotal').innerText = total.toFixed(2);
            document.getElementById('modalCarrito').style.display = 'flex';
        }

        function abrirCheckout() {
            if (carrito.length === 0) {
                alert("Tu carrito está vacío. Agrega productos antes de pagar.");
                return;
            }
            cerrarModal('modalCarrito');
            document.getElementById('modalCheckout').style.display = 'flex';
        }

        function procesarPago(e) {
            e.preventDefault();
            alert("¡Pago procesado con éxito! Gracias por tu compra en Skiniverse. Tu pedido se ha registrado correctamente.");
            carrito = [];
            document.getElementById('cartCount').innerText = 0;
            cerrarModal('modalCheckout');
        }

        function abrirFavoritos() {
            if (favoritos.length === 0) {
                alert("No tienes productos marcados en favoritos todavía.");
                return;
            }
            alert(`Actualmente tienes ${favoritos.length} producto(s) en tu lista de favoritos.`);
        }

        function cerrarModal(id) {
            document.getElementById(id).style.display = 'none';
        }

        function cerrarSesion() {
            if (confirm("¿Estás segura de que deseas cerrar sesión?")) {
                window.location.href = "Login.html";
            }
        }
    </script>
</body>
</html>
