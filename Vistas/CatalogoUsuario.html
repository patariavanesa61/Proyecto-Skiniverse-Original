<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo y Tienda - Skiniverse</title>
    <!-- Enlace al archivo de Estilos -->
    <link rel="stylesheet" href="../assets/CSS/EstiloCatalogo.css">
</head>
<body>

    <!-- Barra de Navegación del Usuario -->
    <header class="navbar">
        <div class="nav-brand" style="cursor: pointer;" onclick="location.href='CatalogoUsuario.html'"><span>💧</span> Skiniverse</div>
        <ul class="nav-links">
            <li><a href="CatalogoUsuario.html">Catálogo</a></li>
            <li><a href="#" onclick="abrirFavoritos(); return false;">❤️ Favoritos (<span id="favCount">0</span>)</a></li>
            <li><a href="#" class="cart-icon" onclick="abrirCarrito(); return false;">🛒 Carrito (<span id="cartCount">0</span>)</a></li>
            <li><button type="button" class="btn-logout" onclick="cerrarSesion()">Cerrar Sesión</button></li>
        </ul>
    </header>

    <!-- Contenido Principal -->
    <main class="store-container">
        <div class="store-header">
            <h1>Tu Piel, Tu Propio Universo</h1>
            <p>Explora nuestra selección exclusiva de productos.</p>
        </div>

        <!-- Sección de Filtros -->
        <div class="filters-wrapper">
            <button type="button" id="btnTodos" class="btn-todos active" onclick="seleccionarTodos()">
                📌 Todos
            </button>
            
            <div class="category-select-box">
                <span>🧴</span>
                <select id="selectCategoria" onchange="seleccionarCategoriaDesplegable()">
                    <option value="" disabled selected>Productos por Categoria</option>
                </select>
            </div>
        </div>

        <!-- Grilla de Productos -->
        <div class="products-grid" id="gridProductos">
            <!-- Dinámico -->
        </div>
    </main>

    <!-- Modal de Favoritos -->
    <div class="modal-overlay" id="modalFavoritos">
        <div class="modal-box">
            <h2 style="color: var(--marron-oscuro);">❤️ Mis Productos Favoritos</h2>
            <div id="listaFavoritos" style="margin: 20px 0;"></div>
            <div style="display: flex; justify-content: flex-end;">
                <button type="button" class="btn-detail" onclick="cerrarModal('modalFavoritos')">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- Modal del Carrito -->
    <div class="modal-overlay" id="modalCarrito">
        <div class="modal-box">
            <h2 style="color: var(--marron-oscuro);">🛒 Tu Carrito de Compras</h2>
            <div id="listaCarrito" style="margin: 20px 0;"></div>
            <div style="font-size: 1.2rem; font-weight: bold; text-align: right; margin-bottom: 20px; color: var(--marron-oscuro);">
                Total: $<span id="cartTotal">0.00</span>
            </div>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button type="button" class="btn-detail" onclick="cerrarModal('modalCarrito')">Seguir Comprando</button>
                <button type="button" class="btn-cart" onclick="abrirCheckout()">💳 Proceder al Pago</button>
            </div>
        </div>
    </div>

    <!-- Modal de Pasarela de Pago -->
    <div class="modal-overlay" id="modalCheckout">
        <div class="modal-box">
            <h2 style="color: var(--marron-oscuro);">💳 Pasarela de Pago Segura</h2>
            <form class="checkout-form" onsubmit="procesarPago(event)">
                <label style="color: var(--texto-secundario);">Nombre del Titular</label>
                <input type="text" required placeholder="Ej. Dalgi Quintero">
                
                <label style="color: var(--texto-secundario);">Número de Tarjeta</label>
                <input type="text" required placeholder="**** **** **** 1234" maxlength="19">
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div>
                        <label style="color: var(--texto-secundario);">Vencimiento</label>
                        <input type="text" required placeholder="MM/AA">
                    </div>
                    <div>
                        <label style="color: var(--texto-secundario);">CVV</label>
                        <input type="password" required placeholder="123" maxlength="4">
                    </div>
                </div>

                <label style="color: var(--texto-secundario);">Dirección de Envío</label>
                <input type="text" required placeholder="Ciudad, Barrio, Calle...">

                <div style="display: flex; justify-content: flex-end; gap: 10px; margin-top: 15px;">
                    <button type="button" class="btn-detail" onclick="cerrarModal('modalCheckout')">Cancelar</button>
                    <button type="submit" class="btn-cart" style="background-color: var(--marron-acento); border: none;">Pagar Ahora</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Enlace al archivo de Lógica (JavaScript) -->
    <script src="../Controlador/CatalogoUsuario.js"></script>
</body>
</html>
