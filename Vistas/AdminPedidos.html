<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Pedidos - Skiniverse</title>
    <link rel="stylesheet" href="../assets/CSS/EstiloAdmin.css">

    <style>
        /*Resetear la margen y las fuente*/
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f3f0f8;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 260px;
            background-color: #261742;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 25px 20px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-top">
            <div class="logo-area">
                <span style="font-size: 28px;">🦋</span>
                <h2>Skiniverse</h2>
                <p>Belleza que inspira</p>
            </div>
            <ul class="nav-menu">
                <li class="active"><a href="AdminPedidos.html">📦 Pedidos</a></li>
                <li><a href="AdminProductos.html">🛍️ Productos</a></li>
                <li><a href="#">👥 Clientes</a></li>
            </ul>
        </div>
        <div class="sidebar-footer">
            <a href="Login.html" onclick="cerrarSesion()">🚪 Cerrar sesión</a>
        </div>
    </div>
<div class="main-content" style="flex: 1; padding: 30px; overflow-y: auto; ">
    
    <div class="top-bar" style="display: flex;justify-content: space-around; align-items: center; margin-bottom: 30px;">
        <div class="search-bar-top" style="background: white; padding: 10px 20px; border-radius: 30px; display: flex; align-items: center;">
            <span>🔍</span>
            <input type="text" placeholder="Buscar pedidos, clientes..." style="border: none; margin-left: 10px;">
        </div>

        <div class="user-profile" style="display: flex; align-items: center; gap: 12px;">
            <div class="avatar" style="background-color: #48336d; color: white; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: bold;">Tú</div>
            <div class="user-info">
                <h4 style="font-size: 12px; color: #777;">Administrador</p>
            </div>            
        </div>
</div>

<div class="page-header" style="background: white; padding: 25px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px;">
    <div>
        <h1 style="font-size: 22px; color: #261742;">Pedidos</h1>
            <p style="font-size: 13px; color: #777;">Gestiona y da seguimiento a todos los pedidos.</p>
            </div>
            <button style="background-color: #48336d; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer;">⬇️ Exportar Reporte</button>
    </div>

<div class="stats-grid" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 25px;">
    <div class="stat-card" style="background: white; padding: 20px; border-radius: 16px; position: relative;">
        <span style="position: absolute; top: 20px; right: 20px; background: #e8f8f0; color: #10b981; font-size: 11px; padding: 4px 8px; border-radius: 20px; font-weight: bold;">↑ +12%</span>
        <span style="font-size: 13px; color: #777;">Total de pedidos</span>
        <h3 style="font-size: 24px; color: #261742; margin-top: 10px;">124</h3>
    </div>
</div>

<div style="display: flex; gap: 15px; margin-bottom: 20px;">
    <input type="text" placeholder="Buscar por número de pedido..." style="flex: 1; padding: 10px 15px; border-radius: 10px; border: 1px solid #e0def4; outline: none;">
    <select style="padding: 10px 15px; border-radius: 10px; border: 1px solid #e0def4; background: white;">
        <option>Todos los estados</option>
        <option>Completado</option>
        <option>En proceso</option>
    </select>
</div>

<div style="background: white; border-radius: 16px; overflow: hidden;">
    <table style="width: 100%; border-collapse: collapse; text-align: left;">
        <thead>
            <tr style="background-color: #f8f7fc;">
                <th style="padding: 15px 20px; font-size: 13px; color: #555;">N.° Pedido</th>
                <th style="padding: 15px 20px; font-size: 13px; color: #555;">Cliente</th>
                <th style="padding: 15px 20px; font-size: 13px; color: #555;">Total</th>
                <th style="padding: 15px 20px; font-size: 13px; color: #555;">Estado</th>
                <th style="padding: 15px 20px; font-size: 13px; color: #555;">Acciones</th>
            </tr>
        </thead>
    <tbody>
            <tr>
                <td style="padding: 15px 20px; border-bottom: 1px solid #f1f0f5;"><b>#SKN-00124</b></td>
                <td style="padding: 15px 20px; border-bottom: 1px solid #f1f0f5;">María López</td>
                <td style="padding: 15px 20px; border-bottom: 1px solid #f1f0f5;">$89.900</td>
                <td style="padding: 15px 20px; border-bottom: 1px solid #f1f0f5;">
                    <span style="background-color: #e8f8f0; color: #10b981; padding: 5px 12px; border-radius: 20px; font-size: 12px;">✔ Completado</span>
                </td>
                <td style="padding: 15px 20px; border-bottom: 1px solid #f1f0f5;">
                    <button style="background: #f3f0f8; border: none; padding: 6px 12px; border-radius: 8px; cursor: pointer; color: #48336d;">👁️ Ver</button>
                </td>
            </tr>
    </tbody>
                </table>
            </div>
</body>
